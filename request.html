
<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Կապ մեզ հետ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .contact-box {
      background: white;
      padding: 35px;
      width: 90%;
      max-width: 450px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #4f46e5;
    }

    #status {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="contact-box">
    <h2>Կապ մեզ հետ</h2>

    <form action="https://formspree.io/f/YOUR_FORMSPREE_ID"
          method="POST">

      <input type="text"
             name="name"
             placeholder="Ձեր անունը"
             required>

      <input type="email"
             name="email"
             placeholder="Ձեր Email-ը"
             required>

      <input type="text"
             name="subject"
             placeholder="Թեմա">

      <textarea name="message"
                placeholder="Ձեր հաղորդագրությունը..."
                required></textarea>

      <button type="submit">Ուղարկել</button>
    </form>
  </div>

</body>
</html>
